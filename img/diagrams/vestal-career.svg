<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"><title>A Vestal's 30-year service: ten years learning, ten performing the rites, ten teaching, then free to leave.</title><rect width="640" height="290" fill="#f7f1e6"/><text x="24" y="34" font-size="19" fill="#2b2622" text-anchor="start" font-weight="700">A Vestal's 30 years</text><text x="24" y="56" font-size="13.5" fill="#7d7266" text-anchor="start" font-weight="normal">Chosen as a girl aged 6 to 10.</text><rect x="40" y="100" width="168" height="54" fill="#e3c9a8"/><text x="124" y="126" font-size="13.5" fill="#2b2622" text-anchor="middle" font-weight="600">Learning</text><text x="124" y="144" font-size="12" fill="#2b2622" text-anchor="middle" font-weight="normal">years 1–10</text><rect x="210" y="100" width="168" height="54" fill="#b5532f"/><text x="294" y="126" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="600">Performing the rites</text><text x="294" y="144" font-size="12" fill="#fff" text-anchor="middle" font-weight="normal">years 11–20</text><rect x="380" y="100" width="168" height="54" fill="#7a4a35"/><text x="464" y="126" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="600">Teaching new Vestals</text><text x="464" y="144" font-size="12" fill="#fff" text-anchor="middle" font-weight="normal">years 21–30</text><rect x="550" y="100" width="60" height="54" fill="none" stroke="#2b2622" stroke-dasharray="4 3"/><text x="580" y="126" font-size="13" fill="#2b2622" text-anchor="middle" font-weight="600">Free</text><text x="580" y="142" font-size="12" fill="#2b2622" text-anchor="middle" font-weight="normal">to leave</text><text x="40" y="200" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">Privileges: own property, make a will, official escort, front-row seats.</text><text x="40" y="222" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">Price: strict chastity. Breaking it was punished by burial alive.</text><text x="40" y="258" font-size="13.5" fill="#7d7266" text-anchor="start" font-weight="normal">After 30 years a Vestal could leave and even marry. Few did.</text></svg>
