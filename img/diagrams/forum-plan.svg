<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"><title>Forum plan, north up: the numbered stops from the Arch of Titus west to the Temple of Antoninus and Faustina by the exit.</title><rect width="640" height="400" fill="#f7f1e6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5532f"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2622"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d7aa8"/></marker></defs><text x="24" y="34" font-size="19" fill="#2b2622" text-anchor="start" font-weight="700">The Forum from the Farnese terrace</text><text x="24" y="56" font-size="13.5" fill="#7d7266" text-anchor="start" font-weight="normal">Plan view, north up. You walk from the Arch of Titus (right) to the exit (top).</text><polyline points="464,362 482,241 289,257 295,208 199,208 150,169 180,145 175,117 216,92 261,131 351,156" fill="none" stroke="#b5532f" stroke-width="3" stroke-dasharray="8 6" stroke-linejoin="round"/><circle cx="464" cy="362" r="7" fill="#2b2622"/><text x="452" y="366" font-size="12.5" fill="#2b2622" text-anchor="end" font-weight="600">7  Arch of Titus</text><circle cx="482" cy="241" r="7" fill="#2b2622"/><text x="492" y="231" font-size="12.5" fill="#2b2622" text-anchor="start" font-weight="600">8  Basilica of Maxentius</text><circle cx="289" cy="257" r="7" fill="#2b2622"/><text x="283" y="279" font-size="12.5" fill="#2b2622" text-anchor="end" font-weight="600">9  Vesta &amp; Vestals</text><circle cx="295" cy="208" r="7" fill="#2b2622"/><text x="305" y="198" font-size="12.5" fill="#2b2622" text-anchor="start" font-weight="600">10  Temple of Caesar</text><circle cx="199" cy="208" r="7" fill="#2b2622"/><text x="191" y="230" font-size="12.5" fill="#2b2622" text-anchor="end" font-weight="600">11  Basilica Julia</text><circle cx="150" cy="169" r="7" fill="#2b2622"/><text x="140" y="187" font-size="12.5" fill="#2b2622" text-anchor="end" font-weight="600">12  Temple of Saturn</text><circle cx="180" cy="145" r="7" fill="#2b2622"/><text x="168" y="149" font-size="12.5" fill="#2b2622" text-anchor="end" font-weight="600">13  Rostra</text><circle cx="175" cy="117" r="7" fill="#2b2622"/><text x="163" y="105" font-size="12.5" fill="#2b2622" text-anchor="end" font-weight="600">14  Arch of Severus</text><circle cx="216" cy="92" r="7" fill="#2b2622"/><text x="226" y="80" font-size="12.5" fill="#2b2622" text-anchor="start" font-weight="600">16  Senate House</text><circle cx="261" cy="131" r="7" fill="#2b2622"/><text x="271" y="121" font-size="12.5" fill="#2b2622" text-anchor="start" font-weight="600">17  Basilica Aemilia</text><circle cx="351" cy="156" r="7" fill="#2b2622"/><text x="363" y="160" font-size="12.5" fill="#2b2622" text-anchor="start" font-weight="600">18  Antoninus &amp; Faustina</text><circle cx="220" cy="362" r="7" fill="#3d7aa8"/><text x="232" y="356" font-size="12.5" fill="#3d7aa8" text-anchor="start" font-weight="600">6  Farnese terrace (you)</text><text x="24" y="392" font-size="13" fill="#7d7266" text-anchor="start" font-weight="normal">← west: Capitoline Hill</text><text x="616" y="392" font-size="13" fill="#7d7266" text-anchor="end" font-weight="normal">east: Colosseum →</text></svg>
