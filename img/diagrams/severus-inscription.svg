<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"><title>Arch of Septimius Severus: line 4 originally named Geta and was recut to praise the best and bravest emperors.</title><rect width="640" height="380" fill="#f7f1e6"/><text x="24" y="34" font-size="19" fill="#2b2622" text-anchor="start" font-weight="700">Erasing Geta: line 4 of the inscription</text><text x="24" y="56" font-size="13.5" fill="#7d7266" text-anchor="start" font-weight="normal">The bronze letters sat in sockets. New words, old holes.</text><rect x="30" y="80" width="580" height="200" fill="#e3d6c0" stroke="#2b2622"/><rect x="60" y="96" width="520" height="16" fill="#cdb898" opacity="0.7"/><rect x="60" y="126" width="520" height="16" fill="#cdb898" opacity="0.7"/><rect x="60" y="156" width="520" height="16" fill="#cdb898" opacity="0.7"/><text x="320" y="120" font-size="12" fill="#7d7266" text-anchor="middle" font-weight="normal" font-style="italic">line 1 · Septimius Severus</text><text x="320" y="150" font-size="12" fill="#7d7266" text-anchor="middle" font-weight="normal" font-style="italic">line 2 · his titles</text><text x="320" y="180" font-size="12" fill="#7d7266" text-anchor="middle" font-weight="normal" font-style="italic">line 3 · Caracalla</text><rect x="50" y="198" width="540" height="56" fill="#f3e2d9" stroke="#b5532f" stroke-width="2"/><text x="320" y="220" font-size="12.5" fill="#7d7266" text-anchor="middle" font-weight="normal">Original (from the socket holes): P·SEPTIMIO·L·FIL·GETAE·NOBILISS·CAESARI</text><text x="320" y="243" font-size="14" fill="#2b2622" text-anchor="middle" font-weight="700">Recut: OPTIMIS·FORTISSIMISQVE·PRINCIPIBVS</text><text x="30" y="310" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">Original: “to Publius Septimius Geta, son of Lucius, most noble Caesar”</text><text x="30" y="332" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">Replacement: “to the best and bravest emperors”</text><text x="30" y="362" font-size="13.5" fill="#b5532f" text-anchor="start" font-weight="600">Look for: holes on line 4 that do not fit the letters.</text></svg>
