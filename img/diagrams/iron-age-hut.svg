<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"><title>Iron Age hut: a thatched oval hut, and the ring of post holes in the rock that is all that survives of it.</title><rect width="640" height="400" fill="#f7f1e6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5532f"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2622"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d7aa8"/></marker></defs><text x="24" y="34" font-size="19" fill="#2b2622" text-anchor="start" font-weight="700">An Iron Age hut on the Palatine</text><text x="24" y="56" font-size="13.5" fill="#7d7266" text-anchor="start" font-weight="normal">Reconstructed from post holes cut in the rock, 8th century BC.</text><path d="M80,300 L120,200 L330,200 L370,300 z" fill="#d8c3a0" stroke="#2b2622"/><path d="M100,205 L225,90 L350,205 z" fill="#b99a62" stroke="#2b2622"/><line x1="120" y1="205" x2="209.25" y2="100" stroke="#8a7044" stroke-width="0.8"/><line x1="134" y1="205" x2="211.35" y2="100" stroke="#8a7044" stroke-width="0.8"/><line x1="148" y1="205" x2="213.45" y2="100" stroke="#8a7044" stroke-width="0.8"/><line x1="162" y1="205" x2="215.55" y2="100" stroke="#8a7044" stroke-width="0.8"/><line x1="176" y1="205" x2="217.65" y2="100" stroke="#8a7044" stroke-width="0.8"/><line x1="190" y1="205" x2="219.75" y2="100" stroke="#8a7044" stroke-width="0.8"/><line x1="204" y1="205" x2="221.85" y2="100" stroke="#8a7044" stroke-width="0.8"/><line x1="218" y1="205" x2="223.95" y2="100" stroke="#8a7044" stroke-width="0.8"/><line x1="232" y1="205" x2="226.05" y2="100" stroke="#8a7044" stroke-width="0.8"/><line x1="246" y1="205" x2="228.15" y2="100" stroke="#8a7044" stroke-width="0.8"/><line x1="260" y1="205" x2="230.25" y2="100" stroke="#8a7044" stroke-width="0.8"/><line x1="274" y1="205" x2="232.35" y2="100" stroke="#8a7044" stroke-width="0.8"/><line x1="288" y1="205" x2="234.45" y2="100" stroke="#8a7044" stroke-width="0.8"/><line x1="302" y1="205" x2="236.55" y2="100" stroke="#8a7044" stroke-width="0.8"/><line x1="316" y1="205" x2="238.65" y2="100" stroke="#8a7044" stroke-width="0.8"/><line x1="330" y1="205" x2="240.75" y2="100" stroke="#8a7044" stroke-width="0.8"/><rect x="205" y="235" width="40" height="65" fill="#5b4632"/><line x1="60" y1="300" x2="390" y2="300" stroke="#2b2622" stroke-width="2"/><text x="120" y="330" font-size="13" fill="#2b2622" text-anchor="start" font-weight="normal">Walls: woven branches plastered with clay</text><text x="150" y="80" font-size="13" fill="#2b2622" text-anchor="start" font-weight="normal">Thatched roof</text><ellipse cx="510" cy="220" rx="90" ry="68" fill="none" stroke="#7d7266" stroke-dasharray="4 4"/><circle cx="600.0" cy="220.0" r="6" fill="#2b2622"/><circle cx="591.1" cy="249.5" r="6" fill="#2b2622"/><circle cx="566.1" cy="273.2" r="6" fill="#2b2622"/><circle cx="530.0" cy="286.3" r="6" fill="#2b2622"/><circle cx="490.0" cy="286.3" r="6" fill="#2b2622"/><circle cx="453.9" cy="273.2" r="6" fill="#2b2622"/><circle cx="428.9" cy="249.5" r="6" fill="#2b2622"/><circle cx="420.0" cy="220.0" r="6" fill="#2b2622"/><circle cx="428.9" cy="190.5" r="6" fill="#2b2622"/><circle cx="453.9" cy="166.8" r="6" fill="#2b2622"/><circle cx="490.0" cy="153.7" r="6" fill="#2b2622"/><circle cx="530.0" cy="153.7" r="6" fill="#2b2622"/><circle cx="566.1" cy="166.8" r="6" fill="#2b2622"/><circle cx="591.1" cy="190.5" r="6" fill="#2b2622"/><circle cx="510" cy="220" r="7" fill="#b5532f"/><text x="510" y="130" font-size="14" fill="#2b2622" text-anchor="middle" font-weight="600">Plan: what survives</text><text x="510" y="312" font-size="13" fill="#2b2622" text-anchor="middle" font-weight="normal">Ring of post holes in the bedrock,</text><text x="510" y="328" font-size="13" fill="#2b2622" text-anchor="middle" font-weight="normal">central post for the roof</text></svg>
