<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"><title>Colosseum cross-section: travertine outer wall, ring corridors and radial walls under sloping seating, the podium, the arena and the hypogeum below.</title><rect width="640" height="390" fill="#f7f1e6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5532f"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2622"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d7aa8"/></marker></defs><text x="24" y="34" font-size="19" fill="#2b2622" text-anchor="start" font-weight="700">The Colosseum in cross-section</text><text x="24" y="56" font-size="13.5" fill="#7d7266" text-anchor="start" font-weight="normal">From the outer wall (right) to the arena (left). About 48 m high.</text><line x1="20" y1="340" x2="620" y2="340" stroke="#2b2622" stroke-width="2"/><path d="M160,285 L200,285 L200,265 L260,265 L260,240 L330,240 L330,210 L400,210 L400,175 L480,175 L480,140 L540,140 L540,120 L560,120 L560,340 L160,340 Z" fill="#e3d6c0" stroke="#2b2622" stroke-width="1" opacity="1"/><rect x="560" y="70" width="30" height="270" fill="#eadfca" stroke="#2b2622"/><line x1="560" y1="130" x2="590" y2="130" stroke="#2b2622" stroke-width="1"/><line x1="560" y1="190" x2="590" y2="190" stroke="#2b2622" stroke-width="1"/><line x1="560" y1="250" x2="590" y2="250" stroke="#2b2622" stroke-width="1"/><rect x="470" y="170" width="20" height="170" fill="#cdb898" stroke="#2b2622"/><rect x="380" y="230" width="20" height="110" fill="#cdb898" stroke="#2b2622"/><path d="M490,300 Q525,260 560,300" fill="none" stroke="#2b2622" stroke-width="2"/><path d="M400,300 Q435,260 470,300" fill="none" stroke="#2b2622" stroke-width="2"/><path d="M150,300 L150,270 L560,110 L560,130 Z" fill="none" stroke="none"/><rect x="20" y="300" width="140" height="10" fill="#d9c08a"/><rect x="20" y="310" width="140" height="30" fill="none" stroke="#7d7266" stroke-dasharray="4 3"/><text x="90" y="290" font-size="12.5" fill="#2b2622" text-anchor="middle" font-weight="normal">arena floor</text><text x="90" y="330" font-size="12" fill="#7d7266" text-anchor="middle" font-weight="normal">hypogeum below</text><text x="162" y="278" font-size="12" fill="#2b2622" text-anchor="start" font-weight="normal">podium</text><text x="552" y="84" font-size="12.5" fill="#2b2622" text-anchor="end" font-weight="600">Outer wall:</text><text x="552" y="100" font-size="12.5" fill="#2b2622" text-anchor="end" font-weight="normal">travertine</text><text x="380" y="375" font-size="12.5" fill="#2b2622" text-anchor="middle" font-weight="normal">Ring corridors under the seating</text><text x="250" y="140" font-size="12.5" fill="#2b2622" text-anchor="start" font-weight="normal">Seats rest on sloping vaults</text><text x="250" y="156" font-size="12.5" fill="#2b2622" text-anchor="start" font-weight="normal">carried by radial walls (tufa, brick)</text><text x="250" y="172" font-size="12.5" fill="#2b2622" text-anchor="start" font-weight="normal">and concrete, lighter higher up</text></svg>
