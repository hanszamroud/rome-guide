<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"><title>One hypogeum lift: men at a capstan wind a rope over a pulley to raise a cage through a trapdoor in the arena floor.</title><rect width="640" height="400" fill="#f7f1e6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5532f"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2622"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d7aa8"/></marker></defs><text x="24" y="34" font-size="19" fill="#2b2622" text-anchor="start" font-weight="700">A lift from the underground</text><text x="24" y="56" font-size="13.5" fill="#7d7266" text-anchor="start" font-weight="normal">Reconstruction of one lift. Scholars estimate dozens.</text><rect x="20" y="110" width="600" height="14" fill="#d9c08a" stroke="#2b2622"/><rect x="300" y="110" width="80" height="14" fill="#f7f1e6"/><path d="M300,110 L262,76" stroke="#2b2622" stroke-width="5"/><text x="250" y="72" font-size="12.5" fill="#2b2622" text-anchor="end" font-weight="normal">trapdoor</text><text x="30" y="100" font-size="12.5" fill="#2b2622" text-anchor="start" font-weight="normal">Arena floor: wood covered in sand</text><rect x="295" y="124" width="6" height="240" fill="#cdb898"/><rect x="379" y="124" width="6" height="240" fill="#cdb898"/><rect x="305" y="250" width="70" height="80" fill="none" stroke="#2b2622" stroke-width="2.5"/><line x1="315" y1="250" x2="315" y2="330" stroke="#2b2622" stroke-width="1"/><line x1="327" y1="250" x2="327" y2="330" stroke="#2b2622" stroke-width="1"/><line x1="339" y1="250" x2="339" y2="330" stroke="#2b2622" stroke-width="1"/><line x1="351" y1="250" x2="351" y2="330" stroke="#2b2622" stroke-width="1"/><line x1="363" y1="250" x2="363" y2="330" stroke="#2b2622" stroke-width="1"/><text x="340" y="352" font-size="12.5" fill="#2b2622" text-anchor="middle" font-weight="normal">cage</text><circle cx="340" cy="140" r="9" fill="none" stroke="#2b2622" stroke-width="2"/><line x1="340" y1="149" x2="340" y2="250" stroke="#2b2622" stroke-width="1.5"/><line x1="331" y1="140" x2="180" y2="290" stroke="#2b2622" stroke-width="1.5"/><rect x="160" y="290" width="40" height="70" fill="#8a6a44" stroke="#2b2622"/><line x1="120" y1="300" x2="240" y2="300" stroke="#8a6a44" stroke-width="5"/><circle cx="112" cy="300" r="8" fill="#2b2622"/><circle cx="248" cy="300" r="8" fill="#2b2622"/><text x="180" y="386" font-size="12.5" fill="#2b2622" text-anchor="middle" font-weight="normal">capstan, turned by men pushing bars</text><line x1="440" y1="330" x2="440" y2="160" stroke="#b5532f" stroke-width="2.5" marker-end="url(#ah)"/><text x="452" y="240" font-size="13" fill="#b5532f" text-anchor="start" font-weight="600">cage rises,</text><text x="452" y="256" font-size="13" fill="#b5532f" text-anchor="start" font-weight="normal">trapdoor opens</text><text x="452" y="300" font-size="12.5" fill="#7d7266" text-anchor="start" font-weight="normal">Guides in the wall slots</text><text x="452" y="316" font-size="12.5" fill="#7d7266" text-anchor="start" font-weight="normal">kept the cage straight</text><line x1="20" y1="364" x2="620" y2="364" stroke="#2b2622" stroke-width="2"/></svg>
