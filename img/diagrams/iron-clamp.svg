<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"><title>Travertine blocks joined by an iron clamp set in lead; robbing the clamps left the holes in the Colosseum's walls.</title><rect width="640" height="380" fill="#f7f1e6"/><text x="24" y="34" font-size="19" fill="#2b2622" text-anchor="start" font-weight="700">Why the walls are full of holes</text><text x="24" y="56" font-size="13.5" fill="#7d7266" text-anchor="start" font-weight="normal">Blocks were joined with iron clamps set in lead, not mortar.</text><rect x="80" y="120" width="230" height="150" fill="#e3d6c0" stroke="#2b2622"/><rect x="310" y="120" width="230" height="150" fill="#e3d6c0" stroke="#2b2622"/><rect x="250" y="108" width="120" height="24" fill="#9aa3a8" stroke="#2b2622"/><rect x="250" y="108" width="14" height="40" fill="#9aa3a8" stroke="#2b2622"/><rect x="356" y="108" width="14" height="40" fill="#9aa3a8" stroke="#2b2622"/><rect x="244" y="104" width="132" height="6" fill="#c7ccd0"/><text x="310" y="96" font-size="13.5" fill="#2b2622" text-anchor="middle" font-weight="600">Iron clamp, sealed with molten lead</text><text x="80" y="300" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">Medieval Romans chiselled into the joints to take the iron and lead,</text><text x="80" y="320" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">leaving the pock-marks you see all over the travertine.</text><text x="80" y="356" font-size="13.5" fill="#b5532f" text-anchor="start" font-weight="600">Estimated iron in the building: about 300 tonnes.</text></svg>
