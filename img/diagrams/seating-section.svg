<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"><title>Seating zones from the arena upward: senators on the podium, then knights, citizens, poorer men, and women at the top.</title><rect width="640" height="390" fill="#f7f1e6"/><text x="24" y="34" font-size="19" fill="#2b2622" text-anchor="start" font-weight="700">Where you sat showed who you were</text><text x="24" y="56" font-size="13.5" fill="#7d7266" text-anchor="start" font-weight="normal">Seating zones, simplified. About 50,000 spectators.</text><rect x="30" y="300" width="90" height="40" fill="#d9c08a" stroke="#f7f1e6" stroke-width="2"/><text x="75.0" y="322" font-size="13" fill="#2b2622" text-anchor="middle" font-weight="700">Arena</text><rect x="120" y="270" width="90" height="70" fill="#7a4a35" stroke="#f7f1e6" stroke-width="2"/><text x="165.0" y="292" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">Podium</text><text x="165.0" y="310" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="normal">senators</text><text x="165.0" y="325" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="normal">Vestals</text><rect x="210" y="230" width="100" height="110" fill="#b5532f" stroke="#f7f1e6" stroke-width="2"/><text x="260.0" y="252" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">First tier</text><text x="260.0" y="270" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="normal">knights</text><rect x="310" y="180" width="110" height="160" fill="#d0875f" stroke="#f7f1e6" stroke-width="2"/><text x="365.0" y="202" font-size="13" fill="#2b2622" text-anchor="middle" font-weight="700">Second tier</text><text x="365.0" y="220" font-size="11.5" fill="#2b2622" text-anchor="middle" font-weight="normal">citizens in togas</text><rect x="420" y="130" width="90" height="210" fill="#e3c9a8" stroke="#f7f1e6" stroke-width="2"/><text x="465.0" y="152" font-size="13" fill="#2b2622" text-anchor="middle" font-weight="700">Third tier</text><text x="465.0" y="170" font-size="11.5" fill="#2b2622" text-anchor="middle" font-weight="normal">poorer men</text><rect x="510" y="80" width="100" height="260" fill="#eadfca" stroke="#f7f1e6" stroke-width="2"/><text x="560.0" y="102" font-size="13" fill="#2b2622" text-anchor="middle" font-weight="700">Top tier</text><text x="560.0" y="120" font-size="11.5" fill="#2b2622" text-anchor="middle" font-weight="normal">wooden benches</text><text x="560.0" y="136" font-size="11.5" fill="#2b2622" text-anchor="middle" font-weight="normal">most women,</text><text x="560.0" y="150" font-size="11.5" fill="#2b2622" text-anchor="middle" font-weight="normal">slaves</text><text x="30" y="372" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">Emperor's box: middle of a long side, at podium level.</text></svg>
