<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"><title>Roman treadwheel crane: men walking inside a wheel wind a rope through pulleys to lift heavy stone blocks.</title><rect width="640" height="400" fill="#f7f1e6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5532f"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2622"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d7aa8"/></marker></defs><text x="24" y="34" font-size="19" fill="#2b2622" text-anchor="start" font-weight="700">Treadwheel crane</text><text x="24" y="56" font-size="13.5" fill="#7d7266" text-anchor="start" font-weight="normal">Men walking inside the wheel lifted blocks of several tonnes.</text><line x1="30" y1="360" x2="610" y2="360" stroke="#2b2622" stroke-width="2"/><line x1="200" y1="360" x2="330" y2="80" stroke="#8a6a44" stroke-width="9"/><line x1="300" y1="360" x2="330" y2="80" stroke="#8a6a44" stroke-width="9"/><circle cx="160" cy="280" r="76" fill="none" stroke="#8a6a44" stroke-width="7"/><line x1="160" y1="280" x2="236.0" y2="280.0" stroke="#8a6a44" stroke-width="2"/><line x1="160" y1="280" x2="213.74011537017762" y2="333.7401153701776" stroke="#8a6a44" stroke-width="2"/><line x1="160" y1="280" x2="160.0" y2="356.0" stroke="#8a6a44" stroke-width="2"/><line x1="160" y1="280" x2="106.2598846298224" y2="333.7401153701776" stroke="#8a6a44" stroke-width="2"/><line x1="160" y1="280" x2="84.0" y2="280.0" stroke="#8a6a44" stroke-width="2"/><line x1="160" y1="280" x2="106.25988462982238" y2="226.2598846298224" stroke="#8a6a44" stroke-width="2"/><line x1="160" y1="280" x2="160.0" y2="204.0" stroke="#8a6a44" stroke-width="2"/><line x1="160" y1="280" x2="213.7401153701776" y2="226.25988462982238" stroke="#8a6a44" stroke-width="2"/><circle cx="152" cy="316" r="8" fill="#2b2622"/><line x1="152" y1="324" x2="148" y2="350" stroke="#2b2622" stroke-width="4"/><path d="M160,280 L330,84 L470,84" fill="none" stroke="#2b2622" stroke-width="1.5"/><line x1="330" y1="80" x2="470" y2="84" stroke="#8a6a44" stroke-width="6"/><circle cx="470" cy="90" r="9" fill="none" stroke="#2b2622" stroke-width="2"/><circle cx="470" cy="160" r="9" fill="none" stroke="#2b2622" stroke-width="2"/><line x1="462" y1="92" x2="462" y2="160" stroke="#2b2622" stroke-width="1.5"/><line x1="478" y1="92" x2="478" y2="160" stroke="#2b2622" stroke-width="1.5"/><line x1="470" y1="169" x2="470" y2="230" stroke="#2b2622" stroke-width="1.5"/><rect x="425" y="230" width="90" height="56" fill="#e3d6c0" stroke="#2b2622"/><text x="470" y="263" font-size="12" fill="#2b2622" text-anchor="middle" font-weight="normal">travertine</text><line x1="470" y1="300" x2="470" y2="340" stroke="#b5532f" stroke-width="2.5" marker-end="url(#ah)"/><text x="40" y="180" font-size="13" fill="#2b2622" text-anchor="start" font-weight="normal">Walking turns</text><text x="40" y="196" font-size="13" fill="#2b2622" text-anchor="start" font-weight="normal">the wheel</text><text x="500" y="130" font-size="13" fill="#2b2622" text-anchor="start" font-weight="normal">Pulley block:</text><text x="500" y="146" font-size="13" fill="#2b2622" text-anchor="start" font-weight="normal">more pulleys,</text><text x="500" y="162" font-size="13" fill="#2b2622" text-anchor="start" font-weight="normal">less effort</text><text x="330" y="390" font-size="13" fill="#b5532f" text-anchor="middle" font-weight="600">Big wheel + pulleys = a few men lift several tonnes</text></svg>
