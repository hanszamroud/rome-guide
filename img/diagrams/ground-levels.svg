<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"><title>Temple of Antoninus and Faustina: the church door sits at the medieval ground level, metres above the ancient one.</title><rect width="640" height="400" fill="#f7f1e6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5532f"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2622"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d7aa8"/></marker></defs><text x="24" y="34" font-size="19" fill="#2b2622" text-anchor="start" font-weight="700">How deep the Forum was buried</text><text x="24" y="56" font-size="13.5" fill="#7d7266" text-anchor="start" font-weight="normal">Temple of Antoninus and Faustina, front view.</text><rect x="120" y="270" width="400" height="80" fill="#cdb898" stroke="#2b2622"/><rect x="150" y="110" width="22" height="160" fill="#e8e2d6" stroke="#2b2622"/><rect x="210" y="110" width="22" height="160" fill="#e8e2d6" stroke="#2b2622"/><rect x="270" y="110" width="22" height="160" fill="#e8e2d6" stroke="#2b2622"/><rect x="330" y="110" width="22" height="160" fill="#e8e2d6" stroke="#2b2622"/><rect x="390" y="110" width="22" height="160" fill="#e8e2d6" stroke="#2b2622"/><rect x="450" y="110" width="22" height="160" fill="#e8e2d6" stroke="#2b2622"/><rect x="130" y="88" width="380" height="22" fill="#e3d6c0" stroke="#2b2622"/><rect x="295" y="160" width="50" height="80" fill="#6b4f36"/><line x1="40" y1="350" x2="600" y2="350" stroke="#2b2622" stroke-width="2"/><text x="600" y="372" font-size="13" fill="#2b2622" text-anchor="end" font-weight="600">Ancient ground level</text><line x1="40" y1="240" x2="600" y2="240" stroke="#b5532f" stroke-width="2" stroke-dasharray="8 6"/><text x="600" y="232" font-size="13" fill="#b5532f" text-anchor="end" font-weight="600">Medieval ground level</text><rect x="40" y="240" width="80" height="110" fill="#b5532f" opacity="0.12"/><rect x="520" y="240" width="80" height="110" fill="#b5532f" opacity="0.12"/><line x1="80" y1="340" x2="80" y2="252" stroke="#2b2622" stroke-width="1.5" marker-end="url(#ahi)"/><text x="90" y="300" font-size="12.5" fill="#2b2622" text-anchor="start" font-weight="normal">metres of</text><text x="90" y="316" font-size="12.5" fill="#2b2622" text-anchor="start" font-weight="normal">soil and rubble</text><text x="320" y="150" font-size="13" fill="#2b2622" text-anchor="middle" font-weight="600">Church door</text><text x="320" y="395" font-size="12.5" fill="#7d7266" text-anchor="middle" font-weight="normal">The door was set at the level people walked on in the Middle Ages.</text></svg>
