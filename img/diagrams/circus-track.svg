<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"><title>Circus Maximus from above: starting gates, the central spina with a turning post at each end, and the anticlockwise race.</title><rect width="640" height="400" fill="#f7f1e6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5532f"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2622"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d7aa8"/></marker></defs><text x="24" y="34" font-size="19" fill="#2b2622" text-anchor="start" font-weight="700">Circus Maximus, seen from above</text><text x="24" y="56" font-size="13.5" fill="#7d7266" text-anchor="start" font-weight="normal">About 600 m long. Seven laps, anticlockwise.</text><path d="M60,110 L520,110 A90,90 0 0 1 520,290 L60,290 Q48,200 60,110 z" fill="#e3d6c0" stroke="#cdb898" stroke-width="10"/><rect x="150" y="194" width="330" height="12" rx="6" fill="#cdb898" stroke="#2b2622" stroke-width="1"/><circle cx="140" cy="200" r="11" fill="#b5532f"/><circle cx="490" cy="200" r="11" fill="#b5532f"/><rect x="56" y="122.0" width="14" height="10" fill="#2b2622" opacity="0.7"/><rect x="56" y="135.5" width="14" height="10" fill="#2b2622" opacity="0.7"/><rect x="56" y="149.0" width="14" height="10" fill="#2b2622" opacity="0.7"/><rect x="56" y="162.5" width="14" height="10" fill="#2b2622" opacity="0.7"/><rect x="56" y="176.0" width="14" height="10" fill="#2b2622" opacity="0.7"/><rect x="56" y="189.5" width="14" height="10" fill="#2b2622" opacity="0.7"/><rect x="56" y="203.0" width="14" height="10" fill="#2b2622" opacity="0.7"/><rect x="56" y="216.5" width="14" height="10" fill="#2b2622" opacity="0.7"/><rect x="56" y="230.0" width="14" height="10" fill="#2b2622" opacity="0.7"/><rect x="56" y="243.5" width="14" height="10" fill="#2b2622" opacity="0.7"/><rect x="56" y="257.0" width="14" height="10" fill="#2b2622" opacity="0.7"/><rect x="56" y="270.5" width="14" height="10" fill="#2b2622" opacity="0.7"/><path d="M455,150 C530,150 545,250 455,250" fill="none" stroke="#b5532f" stroke-width="2.5" marker-end="url(#ah)"/><path d="M455,250 L190,250" fill="none" stroke="#b5532f" stroke-width="2.5" marker-end="url(#ah)"/><path d="M185,250 C110,250 110,150 185,150" fill="none" stroke="#b5532f" stroke-width="2.5" marker-end="url(#ah)"/><path d="M190,150 L450,150" fill="none" stroke="#b5532f" stroke-width="2.5" marker-end="url(#ah)"/><text x="315" y="186" font-size="13" fill="#2b2622" text-anchor="middle" font-weight="normal">spina (central barrier)</text><text x="120" y="205" font-size="13" fill="#b5532f" text-anchor="end" font-weight="600">meta</text><text x="560" y="205" font-size="13" fill="#b5532f" text-anchor="start" font-weight="600">meta</text><text x="80" y="316" font-size="13" fill="#2b2622" text-anchor="start" font-weight="normal">starting gates</text><text x="80" y="332" font-size="12" fill="#7d7266" text-anchor="start" font-weight="normal">(carceres)</text><text x="340" y="96" font-size="13" fill="#2b2622" text-anchor="middle" font-weight="normal">Palatine side: the emperor's box looked down here</text><text x="340" y="362" font-size="13" fill="#7d7266" text-anchor="middle" font-weight="normal">Aventine side</text><text x="560" y="340" font-size="12.5" fill="#2b2622" text-anchor="middle" font-weight="normal">Crashes at the turns:</text><text x="560" y="356" font-size="12.5" fill="#7d7266" text-anchor="middle" font-weight="normal">naufragia, “shipwrecks”</text></svg>
