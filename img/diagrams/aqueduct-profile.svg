<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"><title>Aqueduct profile: the water falls gently from the springs and crosses low ground on arches to arrive high on the Palatine.</title><rect width="640" height="400" fill="#f7f1e6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5532f"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2622"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d7aa8"/></marker></defs><text x="24" y="34" font-size="19" fill="#2b2622" text-anchor="start" font-weight="700">How water reached the palace</text><text x="24" y="56" font-size="13.5" fill="#7d7266" text-anchor="start" font-weight="normal">Aqua Claudia, side profile. Not to scale.</text><path d="M0,120 C60,110 90,130 140,150 L140,400 L0,400 z" fill="#cdb898"/><path d="M140,300 C260,300 300,280 360,285 L360,400 L140,400 z" fill="#e3d6c0"/><path d="M360,285 C390,280 395,250 420,250 L450,250 C460,300 480,330 520,330 C540,300 545,230 580,225 L640,225 L640,400 L360,400 z" fill="#cdb898"/><path d="M60,138 L140,175 L360,212 L600,226" fill="none" stroke="#3d7aa8" stroke-width="5" stroke-linecap="round"/><path d="M60,138 L140,175" fill="none" stroke="#f7f1e6" stroke-width="2" stroke-dasharray="4 5"/><path d="M160,182.36363636363637 L160,300 M182,182.36363636363637 L182,300" stroke="#b5532f" stroke-width="3"/><path d="M160,204.36363636363637 Q171,188.36363636363637 182,204.36363636363637" fill="none" stroke="#b5532f" stroke-width="3"/><path d="M182,186.06363636363636 L182,300 M204,186.06363636363636 L204,300" stroke="#b5532f" stroke-width="3"/><path d="M182,208.06363636363636 Q193,192.06363636363636 204,208.06363636363636" fill="none" stroke="#b5532f" stroke-width="3"/><path d="M204,189.76363636363635 L204,300 M226,189.76363636363635 L226,300" stroke="#b5532f" stroke-width="3"/><path d="M204,211.76363636363635 Q215,195.76363636363635 226,211.76363636363635" fill="none" stroke="#b5532f" stroke-width="3"/><path d="M226,193.46363636363637 L226,300 M248,193.46363636363637 L248,300" stroke="#b5532f" stroke-width="3"/><path d="M226,215.46363636363637 Q237,199.46363636363637 248,215.46363636363637" fill="none" stroke="#b5532f" stroke-width="3"/><path d="M248,197.16363636363636 L248,300 M270,197.16363636363636 L270,300" stroke="#b5532f" stroke-width="3"/><path d="M248,219.16363636363636 Q259,203.16363636363636 270,219.16363636363636" fill="none" stroke="#b5532f" stroke-width="3"/><path d="M270,200.86363636363637 L270,300 M292,200.86363636363637 L292,300" stroke="#b5532f" stroke-width="3"/><path d="M270,222.86363636363637 Q281,206.86363636363637 292,222.86363636363637" fill="none" stroke="#b5532f" stroke-width="3"/><path d="M292,204.56363636363636 L292,300 M314,204.56363636363636 L314,300" stroke="#b5532f" stroke-width="3"/><path d="M292,226.56363636363636 Q303,210.56363636363636 314,226.56363636363636" fill="none" stroke="#b5532f" stroke-width="3"/><path d="M314,208.26363636363635 L314,300 M336,208.26363636363635 L336,300" stroke="#b5532f" stroke-width="3"/><path d="M314,230.26363636363635 Q325,214.26363636363635 336,230.26363636363635" fill="none" stroke="#b5532f" stroke-width="3"/><path d="M336,211.96363636363637 L336,300 M358,211.96363636363637 L358,300" stroke="#b5532f" stroke-width="3"/><path d="M336,233.96363636363637 Q347,217.96363636363637 358,233.96363636363637" fill="none" stroke="#b5532f" stroke-width="3"/><path d="M358,215.66363636363636 L358,300 M380,215.66363636363636 L380,300" stroke="#b5532f" stroke-width="3"/><path d="M358,237.66363636363636 Q369,221.66363636363636 380,237.66363636363636" fill="none" stroke="#b5532f" stroke-width="3"/><path d="M470,222.41666666666666 L470,330 M488,222.41666666666666 L488,330" stroke="#b5532f" stroke-width="3"/><path d="M470,240.41666666666666 Q479,227.41666666666666 488,240.41666666666666" fill="none" stroke="#b5532f" stroke-width="3"/><path d="M488,223.46666666666667 L488,330 M506,223.46666666666667 L506,330" stroke="#b5532f" stroke-width="3"/><path d="M488,241.46666666666667 Q497,228.46666666666667 506,241.46666666666667" fill="none" stroke="#b5532f" stroke-width="3"/><path d="M506,224.51666666666668 L506,330 M524,224.51666666666668 L524,330" stroke="#b5532f" stroke-width="3"/><path d="M506,242.51666666666668 Q515,229.51666666666668 524,242.51666666666668" fill="none" stroke="#b5532f" stroke-width="3"/><path d="M524,225.56666666666666 L524,330 M542,225.56666666666666 L542,330" stroke="#b5532f" stroke-width="3"/><path d="M524,243.56666666666666 Q533,230.56666666666666 542,243.56666666666666" fill="none" stroke="#b5532f" stroke-width="3"/><path d="M542,226.61666666666667 L542,330 M560,226.61666666666667 L560,330" stroke="#b5532f" stroke-width="3"/><path d="M542,244.61666666666667 Q551,231.61666666666667 560,244.61666666666667" fill="none" stroke="#b5532f" stroke-width="3"/><rect x="590" y="200" width="34" height="24" fill="#3d7aa8" opacity="0.8"/><text x="24" y="100" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">Springs in the hills,</text><text x="24" y="116" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">about 70 km east</text><text x="14" y="200" font-size="12" fill="#5a4e42" text-anchor="start" font-weight="normal" font-style="italic">underground channel</text><text x="200" y="150" font-size="13.5" fill="#3d7aa8" text-anchor="start" font-weight="600">Gentle, steady fall all the way</text><text x="170" y="330" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">Arches carry the channel</text><text x="170" y="346" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">over low ground near Rome</text><text x="440" y="365" font-size="13" fill="#2b2622" text-anchor="start" font-weight="normal">Valley between Caelian</text><text x="440" y="381" font-size="13" fill="#2b2622" text-anchor="start" font-weight="normal">and Palatine: still on arches</text><text x="632" y="176" font-size="13" fill="#2b2622" text-anchor="end" font-weight="normal">Palatine: cisterns,</text><text x="632" y="192" font-size="13" fill="#2b2622" text-anchor="end" font-weight="normal">then lead pipes</text><text x="400" y="242" font-size="12" fill="#7d7266" text-anchor="start" font-weight="normal">Caelian</text><text x="610" y="245" font-size="12" fill="#7d7266" text-anchor="middle" font-weight="normal">Palatine</text></svg>
