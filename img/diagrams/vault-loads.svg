<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"><title>Basilica of Maxentius in section: the central vaults send weight down into the piers, and the side bays brace them against spreading.</title><rect width="640" height="400" fill="#f7f1e6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5532f"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2622"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d7aa8"/></marker></defs><text x="24" y="34" font-size="19" fill="#2b2622" text-anchor="start" font-weight="700">How the Basilica of Maxentius stood</text><text x="24" y="56" font-size="13.5" fill="#7d7266" text-anchor="start" font-weight="normal">Cross-section. Everything works in compression.</text><line x1="40" y1="340" x2="600" y2="340" stroke="#2b2622" stroke-width="2"/><path d="M190,340 L190,170 Q320,60 450,170 L450,340 L420,340 L420,180 Q320,95 220,180 L220,340 z" fill="#cdb898" stroke="#2b2622"/><path d="M70,340 L70,240 Q130,180 190,230 L190,340 L175,340 L175,245 Q130,205 85,250 L85,340 z" fill="#e3d6c0" stroke="#2b2622"/><path d="M570,340 L570,240 Q510,180 450,230 L450,340 L465,340 L465,245 Q510,205 555,250 L555,340 z" fill="#e3d6c0" stroke="#2b2622"/><line x1="320" y1="110" x2="320" y2="150" stroke="#b5532f" stroke-width="2.5" marker-end="url(#ah)"/><line x1="240" y1="160" x2="205" y2="220" stroke="#b5532f" stroke-width="2.5" marker-end="url(#ah)"/><line x1="400" y1="160" x2="435" y2="220" stroke="#b5532f" stroke-width="2.5" marker-end="url(#ah)"/><line x1="205" y1="260" x2="205" y2="330" stroke="#b5532f" stroke-width="2.5" marker-end="url(#ah)"/><line x1="435" y1="260" x2="435" y2="330" stroke="#b5532f" stroke-width="2.5" marker-end="url(#ah)"/><line x1="150" y1="280" x2="185" y2="280" stroke="#2b2622" stroke-width="2" marker-end="url(#ahi)"/><line x1="490" y1="280" x2="455" y2="280" stroke="#2b2622" stroke-width="2" marker-end="url(#ahi)"/><text x="320" y="205" font-size="13.5" fill="#2b2622" text-anchor="middle" font-weight="600">Central hall</text><text x="320" y="222" font-size="12.5" fill="#7d7266" text-anchor="middle" font-weight="normal">cross vaults, ~35 m high</text><text x="110" y="370" font-size="12.5" fill="#2b2622" text-anchor="start" font-weight="normal">Side bays (what you see today)</text><text x="30" y="150" font-size="13" fill="#b5532f" text-anchor="start" font-weight="600">Weight flows down</text><text x="30" y="166" font-size="13" fill="#b5532f" text-anchor="start" font-weight="normal">into massive piers</text><text x="470" y="120" font-size="13" fill="#2b2622" text-anchor="start" font-weight="normal">Vaults push outward;</text><text x="470" y="136" font-size="13" fill="#2b2622" text-anchor="start" font-weight="normal">side bays push back</text><text x="320" y="392" font-size="13" fill="#7d7266" text-anchor="middle" font-weight="normal" font-style="italic">Concrete is strong when squeezed, weak when stretched</text></svg>
