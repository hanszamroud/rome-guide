<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"><title>Timeline 49 to 27 BC: Rubicon, Caesar's murder, Cicero's death, Philippi, Actium, the Temple of Caesar, Augustus.</title><rect width="640" height="400" fill="#f7f1e6"/><text x="24" y="34" font-size="19" fill="#2b2622" text-anchor="start" font-weight="700">How the Republic ended</text><text x="24" y="56" font-size="13.5" fill="#7d7266" text-anchor="start" font-weight="normal">From the Rubicon to Augustus in 22 years.</text><line x1="120" y1="82" x2="120" y2="332" stroke="#2b2622" stroke-width="2"/><circle cx="120" cy="92" r="7" fill="#2b2622"/><text x="100" y="97" font-size="14" fill="#b5532f" text-anchor="end" font-weight="700">49 BC</text><text x="140" y="97" font-size="14" fill="#2b2622" text-anchor="start" font-weight="normal">Caesar crosses the Rubicon</text><circle cx="120" cy="132" r="7" fill="#b5532f"/><text x="100" y="137" font-size="14" fill="#b5532f" text-anchor="end" font-weight="700">44 BC</text><text x="140" y="137" font-size="14" fill="#2b2622" text-anchor="start" font-weight="600">Caesar killed; cremated here</text><circle cx="120" cy="172" r="7" fill="#2b2622"/><text x="100" y="177" font-size="14" fill="#b5532f" text-anchor="end" font-weight="700">43 BC</text><text x="140" y="177" font-size="14" fill="#2b2622" text-anchor="start" font-weight="normal">Triumvirs' death lists; Cicero killed</text><circle cx="120" cy="212" r="7" fill="#2b2622"/><text x="100" y="217" font-size="14" fill="#b5532f" text-anchor="end" font-weight="700">42 BC</text><text x="140" y="217" font-size="14" fill="#2b2622" text-anchor="start" font-weight="normal">Philippi: Brutus &amp; Cassius lose</text><circle cx="120" cy="252" r="7" fill="#2b2622"/><text x="100" y="257" font-size="14" fill="#b5532f" text-anchor="end" font-weight="700">31 BC</text><text x="140" y="257" font-size="14" fill="#2b2622" text-anchor="start" font-weight="normal">Actium: Antony &amp; Cleopatra lose</text><circle cx="120" cy="292" r="7" fill="#2b2622"/><text x="100" y="297" font-size="14" fill="#b5532f" text-anchor="end" font-weight="700">29 BC</text><text x="140" y="297" font-size="14" fill="#2b2622" text-anchor="start" font-weight="normal">Temple of the Divine Julius</text><circle cx="120" cy="332" r="7" fill="#b5532f"/><text x="100" y="337" font-size="14" fill="#b5532f" text-anchor="end" font-weight="700">27 BC</text><text x="140" y="337" font-size="14" fill="#2b2622" text-anchor="start" font-weight="600">Octavian becomes Augustus</text><text x="140" y="380" font-size="13.5" fill="#7d7266" text-anchor="start" font-weight="normal" font-style="italic">A killing meant to save the Republic ended in monarchy.</text></svg>
