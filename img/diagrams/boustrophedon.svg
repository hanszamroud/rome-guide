<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"><title>The Lapis Niger inscription runs boustrophedon: each line reverses direction, like an ox ploughing a field.</title><rect width="640" height="400" fill="#f7f1e6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5532f"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2622"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d7aa8"/></marker></defs><text x="24" y="34" font-size="19" fill="#2b2622" text-anchor="start" font-weight="700">Writing like an ox ploughs</text><text x="24" y="56" font-size="13.5" fill="#7d7266" text-anchor="start" font-weight="normal">The Lapis Niger pillar, 6th century BC: lines change direction.</text><path d="M230,80 L410,80 L400,380 L240,380 z" fill="#e3d6c0" stroke="#2b2622"/><path d="M262,110 L376,110" stroke="#b5532f" stroke-width="2.5" marker-end="url(#ah)"/><path d="M382,110 q14,23 0,46" fill="none" stroke="#7d7266" stroke-dasharray="3 3"/><path d="M376,156 L262,156" stroke="#b5532f" stroke-width="2.5" marker-end="url(#ah)"/><path d="M256,156 q-14,23 0,46" fill="none" stroke="#7d7266" stroke-dasharray="3 3"/><path d="M262,202 L376,202" stroke="#b5532f" stroke-width="2.5" marker-end="url(#ah)"/><path d="M382,202 q14,23 0,46" fill="none" stroke="#7d7266" stroke-dasharray="3 3"/><path d="M376,248 L262,248" stroke="#b5532f" stroke-width="2.5" marker-end="url(#ah)"/><path d="M256,248 q-14,23 0,46" fill="none" stroke="#7d7266" stroke-dasharray="3 3"/><path d="M262,294 L376,294" stroke="#b5532f" stroke-width="2.5" marker-end="url(#ah)"/><path d="M382,294 q14,23 0,46" fill="none" stroke="#7d7266" stroke-dasharray="3 3"/><path d="M376,340 L262,340" stroke="#b5532f" stroke-width="2.5" marker-end="url(#ah)"/><text x="430" y="140" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">Left to right,</text><text x="430" y="158" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">then right to left,</text><text x="430" y="176" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">then back again</text><text x="430" y="230" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">Contains the word</text><text x="430" y="248" font-size="13.5" fill="#b5532f" text-anchor="start" font-weight="600">for king</text><text x="40" y="200" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">Oldest known</text><text x="40" y="218" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">Latin public</text><text x="40" y="236" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">inscription</text></svg>
