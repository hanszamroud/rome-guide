346" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">stacks of small bricks (pilae)</text><text x="120" y="160" font-size="13.5" fill="#2b2622" text-anchor="start" font-weight="normal">Marble floor on a thick mortar slab, warm underfoot</text><text x="568" y="80" font-size="13" fill="#2b2622" text-anchor="end" font-weight="normal">Hollow wall tiles let the air rise and escape</text><text x="250" y="375" font-size="13.5" fill="#b5532f" text-anchor="start" font-weight="600">Look for: the brick stacks where the floor has gone.</text></svg>
