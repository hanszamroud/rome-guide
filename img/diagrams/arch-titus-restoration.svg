<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"><title>Arch of Titus: the original marble centre and the plainer travertine sides added in the 1821 restoration.</title><rect width="640" height="400" fill="#f7f1e6"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5532f"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2622"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d7aa8"/></marker></defs><text x="24" y="34" font-size="19" fill="#2b2622" text-anchor="start" font-weight="700">Arch of Titus: old and new</text><text x="24" y="56" font-size="13.5" fill="#7d7266" text-anchor="start" font-weight="normal">In 1821 Valadier rebuilt the sides in plain travertine.</text><rect x="140" y="80" width="360" height="290" fill="#e8dcc6" stroke="#2b2622"/><rect x="250" y="80" width="140" height="290" fill="#fbf8f2" stroke="#2b2622"/><rect x="140" y="80" width="360" height="62" fill="none" stroke="#2b2622"/><text x="320" y="106" font-size="11" fill="#2b2622" text-anchor="middle" font-weight="700">SENATVS</text><text x="320" y="122" font-size="11" fill="#2b2622" text-anchor="middle" font-weight="700">POPVLVSQVE</text><text x="320" y="138" font-size="11" fill="#2b2622" text-anchor="middle" font-weight="700">ROMANVS</text><path d="M270,370 L270,230 A50,50 0 0 1 370,230 L370,370 z" fill="#f7f1e6" stroke="#2b2622"/><rect x="174" y="160" width="12" height="200" fill="none" stroke="#2b2622" stroke-width="0.8"/><rect x="224" y="160" width="12" height="200" fill="none" stroke="#2b2622" stroke-width="0.8"/><rect x="404" y="160" width="12" height="200" fill="none" stroke="#2b2622" stroke-width="0.8"/><rect x="454" y="160" width="12" height="200" fill="none" stroke="#2b2622" stroke-width="0.8"/><rect x="30" y="110" width="16" height="16" fill="#fbf8f2" stroke="#2b2622"/><text x="52" y="123" font-size="13" fill="#2b2622" text-anchor="start" font-weight="normal">Original</text><text x="52" y="139" font-size="13" fill="#2b2622" text-anchor="start" font-weight="normal">marble</text><rect x="30" y="160" width="16" height="16" fill="#e8dcc6" stroke="#2b2622"/><text x="52" y="173" font-size="13" fill="#2b2622" text-anchor="start" font-weight="normal">1821</text><text x="52" y="189" font-size="13" fill="#2b2622" text-anchor="start" font-weight="normal">travertine</text><text x="320" y="395" font-size="13" fill="#b5532f" text-anchor="middle" font-weight="600">Simpler new parts so anyone can tell old from new</text><text x="512" y="214" font-size="13" fill="#2b2622" text-anchor="start" font-weight="normal">Inside the</text><text x="512" y="230" font-size="13" fill="#2b2622" text-anchor="start" font-weight="normal">passage: the</text><text x="512" y="246" font-size="13" fill="#2b2622" text-anchor="start" font-weight="normal">menorah relief</text><line x1="508" y1="240" x2="372" y2="280" stroke="#b5532f" stroke-width="1.5" marker-end="url(#ah)"/></svg>
